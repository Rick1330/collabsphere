location: __LOCATION__
name: collabsphere-migrations
type: Microsoft.App/jobs
properties:
  environmentId: __MANAGED_ENVIRONMENT_ID__
  configuration:
    triggerType: Manual
    replicaRetryLimit: 1
    replicaTimeout: 1800
  template:
    containers:
      - name: migrations
        image: __REGISTRY_SERVER__/__MIGRATIONS_IMAGE__:__IMAGE_TAG__
        command:
          - pnpm
          - prisma
          - migrate
          - deploy
        env:
          - name: DATABASE_URL
            secretRef: database-url
        resources:
          cpu: 0.5
          memory: 1.0Gi
