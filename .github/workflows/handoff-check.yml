name: Handoff Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR linkage and handoff declaration
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) {
              core.info("Draft PR detected. Skipping handoff enforcement until ready for review.");
              return;
            }

            const body = pr.body || "";
            const issueMatches = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|ref(?:s|erences)?)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(issueMatches.map((match) => Number(match[1])).filter(Boolean))];

            if (issueNumbers.length === 0) {
              core.setFailed("PR body must reference at least one GitHub issue using Closes/Fixes/Resolves/Refs #<number>.");
              return;
            }

            const hasNotRequired = /\-\s*\[[xX]\]\s*Handoff not required for this PR/i.test(body);
            const hasAdded = /\-\s*\[[xX]\]\s*Handoff added to the linked issue or parent story/i.test(body);

            if (hasNotRequired && hasAdded) {
              core.setFailed("Select only one handoff checkbox in the PR template.");
              return;
            }

            let requiresHandoff = false;

            for (const issueNumber of issueNumbers) {
              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (error) {
                core.setFailed(`Unable to load linked issue #${issueNumber} in ${context.repo.owner}/${context.repo.repo}: ${error.message}`);
                return;
              }

              if (issue.pull_request) {
                continue;
              }

              const labels = issue.labels
                .map((label) => typeof label === "string" ? label : label.name)
                .filter(Boolean);

              if (!labels.includes("lane:delivery")) {
                continue;
              }

              if (labels.includes("type:task") || labels.includes("type:validation")) {
                requiresHandoff = true;
              }
            }

            if (!requiresHandoff) {
              core.info("Linked issues do not require a delivery handoff declaration.");
              return;
            }

            if (!hasAdded) {
              core.setFailed("Delivery PRs for tasks or validation issues must check \"Handoff added to the linked issue or parent story\" before review.");
              return;
            }

            core.info("Handoff declaration present.");
