name: Vercel Token Health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to validate
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  NODE_VERSION: 20.19.4
  PNPM_VERSION: 9.15.9
  VERCEL_CLI_VERSION: 50.38.3

jobs:
  verify:
    name: verify-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'staging' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Vercel token contract and project access
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_ROLLOVER: ${{ secrets.VERCEL_TOKEN_ROLLOVER }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-vercel-token.sh
