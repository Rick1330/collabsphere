name: Maintenance Intake

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  sync-dependency-source:
    runs-on: ubuntu-latest

    steps:
      - name: Sync dependency source label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.pull_request) {
              core.info("No issue context or issue is a pull request. Skipping.");
              return;
            }

            function extractSectionValue(body, heading) {
              const lines = (body || "").split(/\r?\n/);
              const target = heading.trim().toLowerCase();
              let inSection = false;

              for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith("### ")) {
                  const headingName = trimmed.slice(4).trim().toLowerCase();
                  if (inSection) {
                    break;
                  }
                  inSection = headingName === target;
                  continue;
                }

                if (inSection && trimmed.length > 0) {
                  return trimmed;
                }
              }

              return null;
            }

            const selectedSource = extractSectionValue(issue.body || "", "Source");
            const allowedSources = new Set([
              "source:dependabot",
              "source:manual",
              "source:security-advisory",
              "source:ci",
            ]);

            if (!selectedSource || !allowedSources.has(selectedSource)) {
              core.info(`Issue #${issue.number} does not expose a supported dependency source value. Skipping.`);
              return;
            }

            const { data: labelObjects } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });

            const currentLabels = labelObjects
              .map((label) => label?.name)
              .filter(Boolean);

            if (!currentLabels.includes("type:dependency")) {
              core.info(`Issue #${issue.number} is not a dependency issue. Skipping.`);
              return;
            }

            const sourceLabels = currentLabels.filter((label) => label.startsWith("source:"));
            const labelsToRemove = sourceLabels.filter((label) => label !== selectedSource);
            const needsSelectedSource = !sourceLabels.includes(selectedSource);

            if (!needsSelectedSource && labelsToRemove.length === 0) {
              core.info(`Issue #${issue.number} already has ${selectedSource}.`);
              return;
            }

            if (needsSelectedSource) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [selectedSource],
              });
            }

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label,
                });
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Source label ${label} was already removed from #${issue.number}.`);
                  continue;
                }
                throw error;
              }
            }

            core.info(`Issue #${issue.number} updated with ${selectedSource}.`);
