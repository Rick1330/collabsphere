name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production
        default: production
      image_tag:
        description: Optional backend image tag override
        required: false
        type: string
      allow_branch_staging_deploy:
        description: Allow manual staging validation from a branch that is not yet on main
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: 20.19.4
  PNPM_VERSION: 9.15.9
  TURBO_TELEMETRY_DISABLED: "1"
  VERCEL_CLI_VERSION: 50.38.3

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_type == 'tag' && 'production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment) || 'staging' }}
  cancel-in-progress: false

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      deploy_environment: ${{ steps.target.outputs.deploy_environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      use_existing_image: ${{ steps.target.outputs.use_existing_image }}
      vercel_environment: ${{ steps.target.outputs.vercel_environment }}

    steps:
      - name: Resolve deploy target
        id: target
        shell: bash
        env:
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail

          deploy_environment=""
          image_tag="${GITHUB_SHA}"
          use_existing_image="false"
          vercel_environment="preview"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            deploy_environment="staging"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            deploy_environment="production"
            image_tag="${GITHUB_REF_NAME}"
            vercel_environment="production"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_environment="$INPUT_ENVIRONMENT"
            if [[ "$deploy_environment" == "production" ]]; then
              vercel_environment="production"
            fi

            if [[ -n "$INPUT_IMAGE_TAG" ]]; then
              image_tag="$INPUT_IMAGE_TAG"
              use_existing_image="true"
            fi
          fi

          if [[ -z "$deploy_environment" ]]; then
            echo "Unsupported deploy trigger." >&2
            exit 1
          fi

          echo "deploy_environment=$deploy_environment" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "use_existing_image=$use_existing_image" >> "$GITHUB_OUTPUT"
          echo "vercel_environment=$vercel_environment" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-target
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify deploy ref is already on main
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-target.outputs.deploy_environment }}
          ALLOW_BRANCH_STAGING_DEPLOY: ${{ github.event.inputs.allow_branch_staging_deploy }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DEPLOY_ENVIRONMENT}" == "staging" && "${ALLOW_BRANCH_STAGING_DEPLOY}" == "true" ]]; then
            echo "Branch-based staging validation is allowed for manual workflow_dispatch runs."
            exit 0
          fi

          git fetch origin main --depth=1

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Deploys must target commits already merged to main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build deployable artifacts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @collabsphere/web run build
          pnpm --filter @collabsphere/api run build
          pnpm --filter @collabsphere/collab run build
          pnpm --filter @collabsphere/worker run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-build-artifacts
          path: |
            apps/api/dist
            apps/collab/dist
            apps/web/dist
            apps/worker/dist
          if-no-files-found: error

  deploy:
    needs:
      - resolve-target
      - build
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.deploy_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.resolve-target.outputs.deploy_environment }}
      IMAGE_TAG: ${{ needs.resolve-target.outputs.image_tag }}
      USE_EXISTING_IMAGE: ${{ needs.resolve-target.outputs.use_existing_image }}
      VERCEL_ENVIRONMENT: ${{ needs.resolve-target.outputs.vercel_environment }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_MANAGED_ENVIRONMENT_ID: ${{ vars.AZURE_MANAGED_ENVIRONMENT_ID }}
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      AZURE_CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
      AZURE_ACR_USERNAME: ${{ vars.AZURE_ACR_USERNAME }}
      AZURE_MIGRATIONS_JOB_NAME: ${{ vars.AZURE_MIGRATIONS_JOB_NAME }}
      AZURE_API_CONTAINERAPP_NAME: ${{ vars.AZURE_API_CONTAINERAPP_NAME }}
      AZURE_COLLAB_CONTAINERAPP_NAME: ${{ vars.AZURE_COLLAB_CONTAINERAPP_NAME }}
      AZURE_WORKER_CONTAINERAPP_NAME: ${{ vars.AZURE_WORKER_CONTAINERAPP_NAME }}
      AZURE_S3_AUTH_ID_REF: ${{ vars.AZURE_S3_AUTH_ID_REF }}
      AZURE_S3_AUTH_VALUE_REF: ${{ vars.AZURE_S3_AUTH_VALUE_REF }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: deploy-build-artifacts
          path: ${{ runner.temp }}/deploy-build-artifacts

      - name: Stage downloaded build artifacts into workspace
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="${RUNNER_TEMP}/deploy-build-artifacts"

          for service in api collab web worker; do
            artifact_dir="$(
              find "$artifact_root" -path "*/${service}/dist" -type d -print -quit
            )"

            if [[ -z "$artifact_dir" ]]; then
              echo "::error::Missing downloaded build artifact for ${service}."
              exit 1
            fi

            rm -rf "apps/${service}/dist"
            mkdir -p "apps/${service}"
            cp -R "$artifact_dir" "apps/${service}/"
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve and validate Vercel token
        id: vercel-token
        shell: bash
        env:
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_ROLLOVER: ${{ secrets.VERCEL_TOKEN_ROLLOVER }}
        run: |
          set -euo pipefail

          token_labels=()
          token_values=()

          if [[ -n "${VERCEL_TOKEN_PRIMARY:-}" ]]; then
            token_labels+=("VERCEL_TOKEN")
            token_values+=("$VERCEL_TOKEN_PRIMARY")
          fi

          if [[ -n "${VERCEL_TOKEN_ROLLOVER:-}" ]]; then
            token_labels+=("VERCEL_TOKEN_ROLLOVER")
            token_values+=("$VERCEL_TOKEN_ROLLOVER")
          fi

          if [[ "${#token_labels[@]}" -eq 0 ]]; then
            echo "::error::Missing Vercel token secret. Set VERCEL_TOKEN (or VERCEL_TOKEN_ROLLOVER) in the ${DEPLOY_ENVIRONMENT} environment."
            exit 1
          fi

          selected_label=""
          selected_token=""

          for index in "${!token_labels[@]}"; do
            label="${token_labels[$index]}"
            token="${token_values[$index]}"

            if auth_output="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" whoami --token "$token" 2>&1)"; then
              selected_label="$label"
              selected_token="$token"
              break
            fi

            if echo "$auth_output" | grep -Eiq "(not valid|invalid token|authentication failed|unauthorized|\\b401\\b)"; then
              echo "::warning::${label} failed Vercel auth preflight for ${DEPLOY_ENVIRONMENT}; trying next configured token (if any)."
              continue
            fi

            echo "::error::Vercel auth preflight encountered a non-token error while validating ${label} for ${DEPLOY_ENVIRONMENT}: ${auth_output}"
            exit 1
          done

          if [[ -z "$selected_token" ]]; then
            echo "::error::No configured Vercel token passed authentication preflight. Rotate or update all configured Vercel token secrets (for example, VERCEL_TOKEN and VERCEL_TOKEN_ROLLOVER) for the ${DEPLOY_ENVIRONMENT} environment."
            exit 1
          fi

          echo "::add-mask::$selected_token"
          echo "token_source=$selected_label" >> "$GITHUB_OUTPUT"
          echo "vercel_token=$selected_token" >> "$GITHUB_OUTPUT"

      - name: Validate Vercel project access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.vercel-token.outputs.vercel_token }}
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_PROJECT_ID are required for Vercel deploy preflight."
            exit 1
          fi

          vercel_project_api_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}"
          vercel_project_response="$RUNNER_TEMP/vercel-project-access.json"
          if ! vercel_http_status="$(
            curl --silent --show-error --output "$vercel_project_response" --write-out "%{http_code}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" \
              "$vercel_project_api_url"
          )"; then
            echo "::error::Vercel project access preflight failed due to network/transport error while validating ${DEPLOY_ENVIRONMENT}."
            exit 1
          fi

          if [[ "$vercel_http_status" != "200" ]]; then
            response_preview="$(head -c 200 "$vercel_project_response" | tr '\n' ' ')"
            echo "::error::Unable to access Vercel project ${VERCEL_PROJECT_ID} in org/team ${VERCEL_ORG_ID} (HTTP ${vercel_http_status}). ${response_preview}"
            exit 1
          fi

          echo "Using ${DEPLOY_ENVIRONMENT} Vercel token source: ${{ steps.vercel-token.outputs.token_source }}"

      - name: Validate required deployment contracts
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_MANAGED_ENVIRONMENT_ID: ${{ vars.AZURE_MANAGED_ENVIRONMENT_ID }}
          AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          AZURE_CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          AZURE_ACR_USERNAME: ${{ vars.AZURE_ACR_USERNAME }}
          AZURE_MIGRATIONS_JOB_NAME: ${{ vars.AZURE_MIGRATIONS_JOB_NAME }}
          AZURE_API_CONTAINERAPP_NAME: ${{ vars.AZURE_API_CONTAINERAPP_NAME }}
          AZURE_COLLAB_CONTAINERAPP_NAME: ${{ vars.AZURE_COLLAB_CONTAINERAPP_NAME }}
          AZURE_WORKER_CONTAINERAPP_NAME: ${{ vars.AZURE_WORKER_CONTAINERAPP_NAME }}
          AZURE_S3_AUTH_ID_REF: ${{ vars.AZURE_S3_AUTH_ID_REF }}
          AZURE_S3_AUTH_VALUE_REF: ${{ vars.AZURE_S3_AUTH_VALUE_REF }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          AZURE_ACR_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}
          VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_ROLLOVER: ${{ secrets.VERCEL_TOKEN_ROLLOVER }}
          RESOLVED_VERCEL_TOKEN: ${{ steps.vercel-token.outputs.vercel_token }}
        run: |
          set -euo pipefail

          required_vars=(
            AZURE_RESOURCE_GROUP
            AZURE_LOCATION
            AZURE_MANAGED_ENVIRONMENT_ID
            AZURE_CONTAINER_REGISTRY_NAME
            AZURE_CONTAINER_REGISTRY_LOGIN_SERVER
            AZURE_ACR_USERNAME
            AZURE_MIGRATIONS_JOB_NAME
            AZURE_S3_AUTH_ID_REF
            AZURE_S3_AUTH_VALUE_REF
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
          )

          required_secrets=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_ACR_PASSWORD
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for deploy.yml."
              exit 1
            fi
          done

          for name in "${required_secrets[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for deploy.yml."
              exit 1
            fi
          done

          if [[ -z "${VERCEL_TOKEN_PRIMARY:-}" && -z "${VERCEL_TOKEN_ROLLOVER:-}" ]]; then
            echo "::error::At least one Vercel token secret (VERCEL_TOKEN or VERCEL_TOKEN_ROLLOVER) is required for deploy.yml."
            exit 1
          fi

          if [[ -z "${RESOLVED_VERCEL_TOKEN:-}" ]]; then
            echo "::error::Resolved Vercel token is missing. Ensure the Resolve and validate Vercel token step runs before contract validation."
            exit 1
          fi

      - name: Authenticate to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes

      - name: Verify Azure Container Apps bootstrap resources exist
        shell: bash
        run: |
          set -euo pipefail

          api_name="${AZURE_API_CONTAINERAPP_NAME:-collabsphere-api-stg}"
          collab_name="${AZURE_COLLAB_CONTAINERAPP_NAME:-collabsphere-collab-stg}"
          worker_name="${AZURE_WORKER_CONTAINERAPP_NAME:-collabsphere-worker-stg}"

          for app_name in "$api_name" "$collab_name" "$worker_name"; do
            if ! az containerapp show --name "$app_name" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "::error::Azure Container App ${app_name} is missing. Run the ACA bootstrap flow before using deploy.yml."
              exit 1
            fi
          done

          if ! az containerapp job show --name "${AZURE_MIGRATIONS_JOB_NAME}" --resource-group "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "::error::Azure Container Apps job ${AZURE_MIGRATIONS_JOB_NAME} is missing. Run the ACA bootstrap flow before using deploy.yml."
            exit 1
          fi

      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_CONTAINER_REGISTRY_NAME"

      - name: Build and push backend images
        if: ${{ env.USE_EXISTING_IMAGE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for service in api collab worker; do
            image_ref="${AZURE_CONTAINER_REGISTRY_LOGIN_SERVER}/collabsphere-${service}:${IMAGE_TAG}"
            docker build \
              --file infra/azure/container-apps/backend-service.Dockerfile \
              --build-arg APP_DIR="apps/${service}" \
              --tag "$image_ref" \
              .
            docker push "$image_ref"
          done

      - name: Render Container Apps manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/containerapps"

          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const runnerTemp = process.env.RUNNER_TEMP;
          const outputDir = path.join(runnerTemp, "containerapps");
          const registryServer = process.env.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER;
          const imageTag = process.env.IMAGE_TAG;
          const substitutions = new Map([
            ["__LOCATION__", process.env.AZURE_LOCATION],
            ["__ACR_USERNAME__", process.env.AZURE_ACR_USERNAME],
            ["__API_CONTAINERAPP_NAME__", process.env.AZURE_API_CONTAINERAPP_NAME || "collabsphere-api-stg"],
            ["__COLLAB_CONTAINERAPP_NAME__", process.env.AZURE_COLLAB_CONTAINERAPP_NAME || "collabsphere-collab-stg"],
            ["__MANAGED_ENVIRONMENT_ID__", process.env.AZURE_MANAGED_ENVIRONMENT_ID],
            ["__MIGRATIONS_JOB_NAME__", process.env.AZURE_MIGRATIONS_JOB_NAME],
            ["__MIGRATIONS_IMAGE__", "collabsphere-api"],
            ["__REGISTRY_SERVER__", registryServer],
            ["__IMAGE_TAG__", imageTag],
            ["__S3_AUTH_ID_REF__", process.env.AZURE_S3_AUTH_ID_REF],
            ["__S3_AUTH_VALUE_REF__", process.env.AZURE_S3_AUTH_VALUE_REF],
            ["__WORKER_CONTAINERAPP_NAME__", process.env.AZURE_WORKER_CONTAINERAPP_NAME || "collabsphere-worker-stg"],
          ]);

          for (const file of [
            "api.containerapp.yaml",
            "collab.containerapp.yaml",
            "migrations.job.yaml",
            "worker.containerapp.yaml",
          ]) {
            const sourcePath = path.join("infra", "azure", "container-apps", file);
            let text = fs.readFileSync(sourcePath, "utf8");
            for (const [needle, replacement] of substitutions) {
              text = text.split(needle).join(replacement);
            }
            const unresolved = [...new Set(text.match(/__[A-Z0-9_]+__/g) ?? [])];
            if (unresolved.length > 0) {
              throw new Error(
                `Unresolved placeholders in ${file}: ${unresolved.join(", ")}`
              );
            }
            fs.writeFileSync(path.join(outputDir, file), text, "utf8");
          }
          EOF

      - name: Ensure ACR pull secret exists on Container Apps resources
        shell: bash
        env:
          AZURE_ACR_PASSWORD: ${{ secrets.AZURE_ACR_PASSWORD }}
        run: |
          set -euo pipefail

          # Incremental deploys only refresh the registry pull secret here.
          # The first-run ACA bootstrap flow provisions the runtime app/job secrets
          # referenced via secretRef in the manifests and must already have run.

          api_name="${AZURE_API_CONTAINERAPP_NAME:-collabsphere-api-stg}"
          collab_name="${AZURE_COLLAB_CONTAINERAPP_NAME:-collabsphere-collab-stg}"
          worker_name="${AZURE_WORKER_CONTAINERAPP_NAME:-collabsphere-worker-stg}"

          for app_name in "$api_name" "$collab_name" "$worker_name"; do
            az containerapp secret set \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets "acr-password=${AZURE_ACR_PASSWORD}"
          done

          az containerapp job secret set \
            --name "${AZURE_MIGRATIONS_JOB_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --secrets "acr-password=${AZURE_ACR_PASSWORD}"

      - name: Update migrations job definition
        shell: bash
        run: |
          set -euo pipefail

          manifest_path="$RUNNER_TEMP/containerapps/migrations.job.yaml"
          az containerapp job update \
            --name "${AZURE_MIGRATIONS_JOB_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --yaml "$manifest_path"

      - name: Run migration job before backend revision promotion
        shell: bash
        run: |
          set -euo pipefail

          execution_name="$(
            az containerapp job start \
              --name "${AZURE_MIGRATIONS_JOB_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query name \
              --output tsv
          )"

          if [[ -z "$execution_name" ]]; then
            echo "::error::Container Apps migration job did not return an execution name."
            exit 1
          fi

          status=""
          for _ in {1..60}; do
            status="$(
              az containerapp job execution show \
                --name "${AZURE_MIGRATIONS_JOB_NAME}" \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --job-execution-name "$execution_name" \
                --query properties.status \
                --output tsv
            )"

            case "$status" in
              Succeeded)
                break
                ;;
              Failed|Canceled)
                echo "::error::Migration job execution ${execution_name} ended with ${status}."
                exit 1
                ;;
            esac

            sleep 10
          done

          if [[ "$status" != "Succeeded" ]]; then
            echo "::error::Migration job execution ${execution_name} did not reach Succeeded."
            exit 1
          fi

      - name: Deploy backend services to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail

          api_name="${AZURE_API_CONTAINERAPP_NAME:-collabsphere-api-stg}"
          collab_name="${AZURE_COLLAB_CONTAINERAPP_NAME:-collabsphere-collab-stg}"
          worker_name="${AZURE_WORKER_CONTAINERAPP_NAME:-collabsphere-worker-stg}"

          az containerapp update \
            --name "$api_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --yaml "$RUNNER_TEMP/containerapps/api.containerapp.yaml"

          az containerapp update \
            --name "$collab_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --yaml "$RUNNER_TEMP/containerapps/collab.containerapp.yaml"

          az containerapp update \
            --name "$worker_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --yaml "$RUNNER_TEMP/containerapps/worker.containerapp.yaml"

      - name: Resolve backend smoke-test URL
        id: backend-smoke-target
        shell: bash
        run: |
          set -euo pipefail

          api_name="${AZURE_API_CONTAINERAPP_NAME:-collabsphere-api-stg}"
          api_fqdn="$(
            az containerapp show \
              --name "$api_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv
          )"

          if [[ -z "$api_fqdn" || "$api_fqdn" == "null" ]]; then
            echo "::error::Could not resolve a public ingress FQDN for ${api_name}."
            exit 1
          fi

          echo "api_health_url=https://${api_fqdn}/api/v1/health" >> "$GITHUB_OUTPUT"

      - name: Deploy web to Vercel
        id: deploy-web
        shell: bash
        env:
          VERCEL_TOKEN: ${{ steps.vercel-token.outputs.vercel_token }}
        run: |
          set -euo pipefail
          deploy_stdout="$RUNNER_TEMP/vercel-deploy.out"
          deploy_stderr="$RUNNER_TEMP/vercel-deploy.err"

          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment="$VERCEL_ENVIRONMENT" --token "$VERCEL_TOKEN"

          if [[ "$DEPLOY_ENVIRONMENT" == "production" ]]; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token "$VERCEL_TOKEN"
            if ! pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token "$VERCEL_TOKEN" >"$deploy_stdout" 2>"$deploy_stderr"; then
              cat "$deploy_stderr"
              exit 1
            fi
          else
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --token "$VERCEL_TOKEN"
            if ! pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token "$VERCEL_TOKEN" >"$deploy_stdout" 2>"$deploy_stderr"; then
              cat "$deploy_stderr"
              exit 1
            fi
          fi

          cat "$deploy_stderr"

          deployment_url="$(awk 'NF { value=$0 } END { print value }' "$deploy_stdout")"

          if [[ -z "$deployment_url" ]]; then
            echo "::error::Could not determine the Vercel deployment URL from vercel deploy output."
            exit 1
          fi

          if ! node -e '
            const candidate = process.argv[1];
            let parsed;
            try {
              parsed = new URL(candidate);
            } catch {
              process.exit(1);
            }
            if (!parsed.hostname.endsWith(".vercel.app")) {
              process.exit(1);
            }
          ' "$deployment_url"; then
            echo "::error::Unexpected Vercel deployment URL: $deployment_url"
            exit 1
          fi

          printf '%s\n' "$deployment_url"

          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI for smoke tests
        shell: bash
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Run post-deploy smoke tests
        timeout-minutes: 10
        shell: bash
        env:
          API_HEALTH_URL: ${{ steps.backend-smoke-target.outputs.api_health_url }}
          WEB_URL: ${{ steps.deploy-web.outputs.deployment_url }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ steps.vercel-token.outputs.vercel_token }}
        run: bash scripts/smoke-test.sh

  notify:
    if: ${{ always() && needs.resolve-target.outputs.deploy_environment != '' }}
    needs:
      - resolve-target
      - build
      - deploy
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.deploy_environment }}
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: ${{ needs.resolve-target.outputs.deploy_environment }}
      DEPLOY_TARGET_SUMMARY: Vercel web + Azure Container Apps backend

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install notification runner dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve notification conclusion
        id: notification
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.resolve-target.result }}" == "success" && "${{ needs.build.result }}" == "success" && "${{ needs.deploy.result }}" == "success" ]]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.resolve-target.result }}" == "cancelled" || "${{ needs.build.result }}" == "cancelled" || "${{ needs.deploy.result }}" == "cancelled" ]]; then
            echo "conclusion=cancelled" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.resolve-target.result }}" == "skipped" || "${{ needs.build.result }}" == "skipped" || "${{ needs.deploy.result }}" == "skipped" ]]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate notification contract
        shell: bash
        env:
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_NOTIFICATION_WEBHOOK_URL:-}" ]]; then
            echo "::error::DEPLOY_NOTIFICATION_WEBHOOK_URL is required for deploy notifications."
            exit 1
          fi

      - name: Send deploy notification
        timeout-minutes: 2
        env:
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          DEPLOY_CONCLUSION: ${{ steps.notification.outputs.conclusion }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/notify-deploy.ts
