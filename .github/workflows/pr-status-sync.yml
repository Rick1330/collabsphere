name: PR Status Sync

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync linked issue statuses
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const matches = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(matches.map((match) => Number(match[1])).filter(Boolean))];

            if (issueNumbers.length === 0) {
              core.info("No linked issue references found in PR body.");
              return;
            }

            const pr = context.payload.pull_request;
            const isMerged = context.payload.action === "closed" && Boolean(pr.merged);
            const isClosedWithoutMerge = context.payload.action === "closed" && !pr.merged;
            const isReadyForReview = context.payload.action === "ready_for_review" && !pr.draft;

            function determineTargetStatus(labelNames) {
              if (labelNames.includes("type:epic") || labelNames.includes("type:story")) {
                return null;
              }

              if (isMerged) {
                return "status:done";
              }

              if (isClosedWithoutMerge) {
                if (labelNames.includes("lane:delivery")) {
                  return "status:ready";
                }
                if (labelNames.includes("lane:maintenance") || labelNames.includes("lane:hotfix")) {
                  return "status:triage";
                }
                return null;
              }

              if (isReadyForReview) {
                return "status:in_review";
              }

              return "status:in_progress";
            }

            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              if (issue.pull_request) {
                core.info(`Skipping #${issueNumber} because it is a pull request.`);
                continue;
              }

              const currentLabels = issue.labels
                .map((label) => typeof label === "string" ? label : label.name)
                .filter(Boolean);

              const targetStatus = determineTargetStatus(currentLabels);
              if (!targetStatus) {
                core.info(`Skipping #${issueNumber} because no status transition applies.`);
                continue;
              }

              const nextLabels = [
                ...currentLabels.filter((label) => !label.startsWith("status:")),
                targetStatus,
              ].sort((left, right) => left.localeCompare(right));

              const labelsChanged =
                nextLabels.length !== currentLabels.length ||
                nextLabels.some((label, index) => currentLabels.slice().sort((a, b) => a.localeCompare(b))[index] !== label);

              if (!labelsChanged) {
                core.info(`No label change needed for #${issueNumber}.`);
                continue;
              }

              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: nextLabels,
              });

              core.info(`Updated #${issueNumber} -> ${targetStatus}`);
            }
