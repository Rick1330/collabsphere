name: PR Status Sync

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr-status-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync linked issue statuses
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const closingMatches = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
            const referenceMatches = [...body.matchAll(/(?:ref(?:s|erences)?)\s+#(\d+)/gi)];
            const linkedIssueNumbers = [
              ...new Set([...closingMatches, ...referenceMatches].map((match) => Number(match[1])).filter(Boolean)),
            ];
            const lifecycleIssueNumbers = [...new Set(closingMatches.map((match) => Number(match[1])).filter(Boolean))];

            if (linkedIssueNumbers.length === 0) {
              core.info("No linked issue references found in PR body.");
              return;
            }

            if (lifecycleIssueNumbers.length === 0) {
              core.info("No closing issue references found in PR body. Skipping lifecycle status sync.");
              return;
            }

            const pr = context.payload.pull_request;
            const isMerged = context.payload.action === "closed" && Boolean(pr.merged);
            const isClosedWithoutMerge = context.payload.action === "closed" && !pr.merged;
            const isReadyForReview =
              !pr.draft &&
              ["opened", "reopened", "ready_for_review"].includes(context.payload.action);
            const isConvertedToDraft =
              pr.draft &&
              context.payload.action === "converted_to_draft";

            function extractSection(bodyText, heading) {
              const lines = (bodyText || "").split(/\r?\n/);
              const target = heading.trim().toLowerCase();
              const collected = [];
              let inSection = false;

              for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith("## ")) {
                  const currentHeading = trimmed.slice(3).trim().toLowerCase();
                  if (inSection) {
                    break;
                  }
                  inSection = currentHeading === target;
                  continue;
                }

                if (inSection) {
                  collected.push(line);
                }
              }

              return collected;
            }

            function normalizeSectionLines(lines, fallbackLine) {
              const cleaned = lines
                .map((line) => line.trimRight())
                .filter((line) => line.trim().length > 0);

              return cleaned.length > 0 ? cleaned : [fallbackLine];
            }

            function escapeRegExp(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function markDoneWhenCheckbox(issueBody, labelText) {
              const pattern = new RegExp(`^(\\s*-\\s*\\[)(?: |x|X)(\\]\\s*${escapeRegExp(labelText)}\\s*)$`, "m");
              return issueBody.replace(pattern, "$1x$2");
            }

            function replaceSection(issueBody, heading, replacementLines) {
              const lines = (issueBody || "").split(/\r?\n/);
              const target = heading.trim().toLowerCase();
              const output = [];
              let replaced = false;
              let index = 0;

              while (index < lines.length) {
                const line = lines[index];
                const trimmed = line.trim();

                if (trimmed.startsWith("## ") && trimmed.slice(3).trim().toLowerCase() === target) {
                  output.push(...replacementLines);
                  replaced = true;
                  index += 1;

                  while (index < lines.length && !lines[index].trim().startsWith("## ")) {
                    index += 1;
                  }

                  continue;
                }

                output.push(line);
                index += 1;
              }

              if (!replaced) {
                if (output.length > 0 && output[output.length - 1].trim() !== "") {
                  output.push("");
                }
                output.push(...replacementLines);
              }

              return output.join("\n");
            }

            async function syncMergedIssueBody(issue) {
              const currentBody = issue.body || "";
              const summaryLines =
                extractSection(body, "Handoff Summary").length > 0
                  ? extractSection(body, "Handoff Summary")
                  : extractSection(body, "Summary");
              const validationLines =
                extractSection(body, "Handoff Validation Evidence").length > 0
                  ? extractSection(body, "Handoff Validation Evidence")
                  : extractSection(body, "Validation");
              const followUpLines = extractSection(body, "Handoff Open Issues / Follow-ups");
              const riskLines =
                extractSection(body, "Handoff Risks / Deviations").length > 0
                  ? extractSection(body, "Handoff Risks / Deviations")
                  : extractSection(body, "Risks / Notes");

              const mergedAt = pr.merged_at || new Date().toISOString();
              const summary = normalizeSectionLines(summaryLines, `- merged via PR #${pr.number}`);
              const validation = normalizeSectionLines(validationLines, `- see PR #${pr.number} for validation details`);
              const followUps = normalizeSectionLines(followUpLines, "- none");
              const risks = normalizeSectionLines(riskLines, "- none");

              let nextBody = currentBody;
              nextBody = markDoneWhenCheckbox(nextBody, "Deliverables implemented.");
              nextBody = markDoneWhenCheckbox(nextBody, "Validation commands executed or explicitly waived.");
              nextBody = markDoneWhenCheckbox(nextBody, "Handoff completed.");

              nextBody = replaceSection(nextBody, "Handoff", [
                "## Handoff",
                "",
                "### Summary of changes",
                ...summary,
                "",
                "### Validation evidence",
                ...validation,
                "",
                "### Open issues / follow-ups",
                ...followUps,
                "",
                "### Risks or deviations",
                ...risks,
                "",
                "### Delivery metadata",
                `- Merged PR: #${pr.number}`,
                `- Merge commit: \`${pr.merge_commit_sha || "unknown"}\``,
                `- Merged at: ${mergedAt}`,
              ]);

              if (nextBody === currentBody) {
                core.info(`Issue body for #${issue.number} already matches merged state.`);
                return;
              }

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: nextBody,
              });

              core.info(`Updated issue body for #${issue.number} after merge.`);
            }

            function determineTargetStatus(labelNames) {
              if (labelNames.includes("type:epic") || labelNames.includes("type:story")) {
                return null;
              }

              if (isMerged) {
                return "status:done";
              }

              if (isClosedWithoutMerge) {
                if (labelNames.includes("lane:delivery")) {
                  return "status:ready";
                }
                if (labelNames.includes("lane:maintenance") || labelNames.includes("lane:hotfix")) {
                  return "status:triage";
                }
                return null;
              }

              if (isReadyForReview) {
                return "status:in_review";
              }

              if (isConvertedToDraft) {
                return "status:in_progress";
              }

              return null;
            }

            for (const issueNumber of lifecycleIssueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              if (issue.pull_request) {
                core.info(`Skipping #${issueNumber} because it is a pull request.`);
                continue;
              }

              const currentLabels = issue.labels
                .map((label) => typeof label === "string" ? label : label.name)
                .filter(Boolean);

              const targetStatus = determineTargetStatus(currentLabels);
              if (!targetStatus) {
                core.info(`Skipping #${issueNumber} because no status transition applies.`);
                continue;
              }

              const nextLabels = [
                ...currentLabels.filter((label) => !label.startsWith("status:")),
                targetStatus,
              ].sort((left, right) => left.localeCompare(right));
              const sortedCurrentLabels = [...currentLabels].sort((left, right) => left.localeCompare(right));

              const labelsChanged =
                nextLabels.length !== sortedCurrentLabels.length ||
                nextLabels.some((label, index) => sortedCurrentLabels[index] !== label);

              if (!labelsChanged) {
                core.info(`No label change needed for #${issueNumber}.`);
              } else {
                await github.rest.issues.setLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: nextLabels,
                });

                core.info(`Updated #${issueNumber} -> ${targetStatus}`);
              }

              if (isMerged && (currentLabels.includes("type:task") || currentLabels.includes("type:validation"))) {
                await syncMergedIssueBody(issue);
              }
            }
